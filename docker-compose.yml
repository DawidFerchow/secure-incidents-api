name: secure-incidents

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: secure-incidents-api:local
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    environment:
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      SEED_RECORDS: "${SEED_RECORDS:-2500}"
      ALLOWED_HOSTS: "localhost,127.0.0.1,app"
    labels:
      com.dawidferchow.logs: "true"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=2)
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    networks:
      - application

  loki:
    image: grafana/loki:3.7.6
    command: -config.file=/etc/loki/config.yaml
    volumes:
      - ./observability/loki/config.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    expose:
      - "3100"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - observability

  alloy:
    image: grafana/alloy:v1.19.1
    command:
      - run
      - --storage.path=/tmp/alloy-data
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    # Dostęp root jest potrzebny do odczytu Docker socket.
    # Kontener nadal nie ma Linux capabilities.
    user: "0:0"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - observability

  grafana:
    image: grafana/grafana:13.2.0
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/incidents-api.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - loki
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - observability

networks:
  application:
  observability:

volumes:
  loki_data:
  grafana_data:
